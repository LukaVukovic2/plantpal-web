<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantPal - Opening app...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.75rem; }
    p { opacity: 0.95; font-size: 1.1rem; }
    .error {
      background: rgba(220, 38, 38, 0.9);
      padding: 1.25rem;
      border-radius: 12px;
      margin-top: 1.5rem;
    }
    .button {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.875rem 2rem;
      background: white;
      color: #667eea;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Opening PlantPal...</h1>
    <p id="status">Confirming your account</p>
    <div id="error" style="display: none;" class="error"></div>
    <a id="manualLink" href="#" style="display: none;" class="button">Open PlantPal App</a>
  </div>

  <script>
    (function() {
      const statusEl = document.getElementById('status');
      const titleEl = document.getElementById('title');
      const errorEl = document.getElementById('error');
      const manualLinkEl = document.getElementById('manualLink');
      const spinnerEl = document.getElementById('spinner');

      try {
        const fullUrl = window.location.href;
        console.log('[Redirect] URL:', fullUrl);

        // Parse URL parameters (both ? and # fragments)
        const url = new URL(fullUrl);
        const params = new URLSearchParams(url.search);
        const hashParams = new URLSearchParams(url.hash.substring(1));

        const allParams = new URLSearchParams();
        params.forEach((value, key) => allParams.set(key, value));
        hashParams.forEach((value, key) => allParams.set(key, value));

        console.log('[Redirect] Params:', Object.fromEntries(allParams));

        const accessToken = allParams.get('access_token');
        const refreshToken = allParams.get('refresh_token');
        const error = allParams.get('error');

        if (error) {
          throw new Error(allParams.get('error_description') || error);
        }

        if (!accessToken || !refreshToken) {
          throw new Error('No authentication tokens found');
        }

        // Build deep link
        const deepLink = `plantpal://login-callback#access_token=${accessToken}&refresh_token=${refreshToken}`;
        console.log('[Redirect] Opening app...');

        manualLinkEl.href = deepLink;
        window.location.href = deepLink;

        // Show manual button after 2 seconds
        setTimeout(() => {
          spinnerEl.style.display = 'none';
          titleEl.textContent = 'App not opening?';
          statusEl.textContent = 'Click below to open PlantPal';
          manualLinkEl.style.display = 'inline-block';
        }, 2000);

      } catch (err) {
        console.error('[Redirect] Error:', err);
        spinnerEl.style.display = 'none';
        titleEl.textContent = 'Something went wrong';
        statusEl.textContent = '';
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
