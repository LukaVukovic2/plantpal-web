<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirming your account...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      opacity: 0.9;
      font-size: 1rem;
    }
    .error {
      background: #dc2626;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
    .manual-link {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background: white;
      color: #667eea;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Confirming your account...</h1>
    <p id="status">Opening PlantPal app...</p>
    <div id="error" style="display: none;" class="error"></div>
    <a id="manualLink" href="#" style="display: none;" class="manual-link">Open PlantPal</a>
  </div>

  <script>
    (function() {
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const manualLinkEl = document.getElementById('manualLink');

      try {
        // Get the full URL including hash fragments
        const fullUrl = window.location.href;
        console.log('Redirect page received URL:', fullUrl);

        // Parse both query params and hash params
        const url = new URL(fullUrl);
        const params = new URLSearchParams(url.search);
        const hashParams = new URLSearchParams(url.hash.substring(1));

        // Combine both sets of parameters
        const allParams = new URLSearchParams();
        params.forEach((value, key) => allParams.set(key, value));
        hashParams.forEach((value, key) => allParams.set(key, value));

        console.log('Parsed parameters:', Object.fromEntries(allParams));

        // Check for tokens
        const accessToken = allParams.get('access_token');
        const refreshToken = allParams.get('refresh_token');
        const error = allParams.get('error');
        const errorDescription = allParams.get('error_description');

        if (error) {
          throw new Error(errorDescription || error);
        }

        if (!accessToken || !refreshToken) {
          throw new Error('No authentication tokens found in URL');
        }

        // Build deep link with tokens
        const deepLink = `plantpal://login-callback#access_token=${accessToken}&refresh_token=${refreshToken}`;
        console.log('Attempting to open:', deepLink);

        // Set up manual link as fallback
        manualLinkEl.href = deepLink;

        // Try to open the app
        window.location.href = deepLink;

        // Show manual link after 2 seconds if redirect didn't work
        setTimeout(() => {
          statusEl.textContent = 'App not opening automatically?';
          manualLinkEl.style.display = 'inline-block';
        }, 2000);

        // Show success message after 5 seconds
        setTimeout(() => {
          statusEl.textContent = 'If the app opened, you can close this page.';
        }, 5000);

      } catch (err) {
        console.error('Redirect error:', err);
        errorEl.textContent = err.message || 'Failed to confirm account';
        errorEl.style.display = 'block';
        statusEl.textContent = 'Something went wrong';
        
        // Redirect to app's error screen after 3 seconds
        setTimeout(() => {
          window.location.href = 'plantpal://login';
        }, 3000);
      }
    })();
  </script>
</body>
</html>
