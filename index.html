<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantPal - Email Confirmed!</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }
    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.75rem; }
    p { opacity: 0.95; font-size: 1.1rem; line-height: 1.6; }
    .error {
      background: rgba(220, 38, 38, 0.9);
      padding: 1.25rem;
      border-radius: 12px;
      margin-top: 1.5rem;
    }
    .button {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.875rem 2rem;
      background: white;
      color: #667eea;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      border: none;
    }
    .button:hover {
      opacity: 0.9;
    }
    .steps {
      background: rgba(255,255,255,0.1);
      padding: 1.5rem;
      border-radius: 12px;
      margin-top: 2rem;
      text-align: left;
    }
    .steps ol {
      margin: 0;
      padding-left: 1.5rem;
    }
    .steps li {
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container" id="container"></div>

  <script>
    (async function() {
      const container = document.getElementById('container');
      
      // Your Supabase credentials
      const SUPABASE_URL = 'https://karqxqzhvnpkhejhdryz.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthcnF4cXpodm5wa2hlamhkcnl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzY3ODQ1MjksImV4cCI6MjA1MjM2MDUyOX0.vXPHKBRbj8YSXLXwcP43-aVHvNxiqXNfwYuEkqhBz5U';
      
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      try {
        console.log('[PlantPal] Processing email confirmation...');
        
        // Get URL parameters
        const fullUrl = window.location.href;
        const hashIndex = fullUrl.indexOf('#');
        const allParams = new URLSearchParams();

        // Parse query and hash params
        if (fullUrl.includes('?')) {
          const queryString = fullUrl.substring(fullUrl.indexOf('?') + 1, hashIndex !== -1 ? hashIndex : fullUrl.length);
          new URLSearchParams(queryString).forEach((v, k) => allParams.set(k, v));
        }
        if (hashIndex !== -1) {
          new URLSearchParams(fullUrl.substring(hashIndex + 1)).forEach((v, k) => allParams.set(k, v));
        }

        const error = allParams.get('error');
        const errorDescription = allParams.get('error_description');

        if (error) {
          throw new Error(errorDescription || error);
        }

        const accessToken = allParams.get('access_token');
        const refreshToken = allParams.get('refresh_token');

        if (!accessToken || !refreshToken) {
          throw new Error('No authentication tokens found. Please try clicking the confirmation link again.');
        }

        console.log('[PlantPal] Setting session...');

        // Set the session in Supabase (this stores it in localStorage)
        const { data, error: sessionError } = await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (sessionError) throw sessionError;

        console.log('[PlantPal] Session created successfully!');

        // Show success message
        container.innerHTML = `
          <div class="success-icon">✅</div>
          <h1>Email Confirmed!</h1>
          <p>Your account has been successfully confirmed.</p>
          <div class="steps">
            <p style="font-weight: 600; margin-bottom: 1rem;">Next steps:</p>
            <ol>
              <li>Open the PlantPal app on your device</li>
              <li>You'll be automatically logged in</li>
              <li>Start your plant journey! 🌱</li>
            </ol>
          </div>
          <p style="margin-top: 2rem; font-size: 0.9rem; opacity: 0.8;">
            You can close this page and return to the app.
          </p>
        `;

      } catch (err) {
        console.error('[PlantPal] Error:', err);
        container.innerHTML = `
          <div class="error">
            <h1>Something went wrong</h1>
            <p>${err.message || 'Failed to confirm your email. Please try again.'}</p>
          </div>
          <a href="plantpal://login" class="button">Open PlantPal</a>
        `;
      }
    })();
  </script>
</body>
</html>
